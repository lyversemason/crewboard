name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  database:
    # The database tests (tests/db): a local Supabase in Docker with the
    # fictional company loaded, then every role signed in and every kind of
    # change made through the server function. The public demo doesn't use the
    # database, so the deploy doesn't wait for this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run test:db
      - name: Server function log (on failure)
        if: failure()
        run: docker logs supabase_edge_runtime_soccer-sessions 2>&1 | tail -80

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
